# ClerkOS — on-premise deployment.
# Runs entirely on the municipal server: no public cloud dependency.
# See docs/09-deployment-guide.md for hardening and backup configuration.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clerkos}
      POSTGRES_USER: ${POSTGRES_USER:-clerkos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clerkos}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      CLERKOS_REDIS_URL: redis://redis:6379/0
      CLERKOS_DOCUMENT_ROOT: /data/documents
    volumes:
      - documents:/data/documents   # host-encrypt this volume (LUKS/BitLocker)
      - backups:/backups
      - static:/app/staticfiles
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [internal]
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py seed &&
             gunicorn clerkos.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      CLERKOS_REDIS_URL: redis://redis:6379/0
      CLERKOS_DOCUMENT_ROOT: /data/documents
      CLERKOS_BACKUP_DIR: /backups
    volumes:
      - documents:/data/documents
      - backups:/backups
    depends_on: [backend]
    networks: [internal]
    command: celery -A clerkos worker --loglevel=info --concurrency=2

  beat:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      CLERKOS_REDIS_URL: redis://redis:6379/0
    depends_on: [backend]
    networks: [internal]
    command: celery -A clerkos beat --loglevel=info

  frontend-build:
    build: ./frontend
    volumes:
      - webroot:/webroot
    command: sh -c "cp -r /app/dist/. /webroot/"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx/clerkos.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - webroot:/usr/share/nginx/html:ro
      - static:/usr/share/nginx/static:ro
    depends_on: [backend, frontend-build]
    networks: [internal]

  # Optional local object storage (enable with: docker compose --profile minio up)
  minio:
    image: minio/minio:latest
    profiles: [minio]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clerkos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  documents:
  backups:
  static:
  webroot:
  miniodata:

networks:
  internal:
    driver: bridge
