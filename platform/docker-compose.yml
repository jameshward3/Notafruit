# Local / private-staging stack for the Orange platform.
# NOT executed in the authoring environment (no Docker daemon) — see BUILD_STATUS.md.
#   docker compose up -d db mailpit          (add --profile s3 for MinIO)
#   docker compose run --rm web pnpm db:migrate
#   docker compose up -d web worker
services:
  db:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_DB: orange_platform, POSTGRES_USER: orange, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in .env}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U orange"], interval: 10s, retries: 10 }
  minio:  # opt-in: docker compose --profile s3 up. Image distribution changed in 2025;
          # set MINIO_IMAGE to an image + tag your organization has verified.
    profiles: [s3]
    image: "${MINIO_IMAGE:?set MINIO_IMAGE to a verified S3-compatible image}"
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: "${S3_ACCESS_KEY_ID:-orange}", MINIO_ROOT_PASSWORD: "${S3_SECRET_ACCESS_KEY:?set in .env}" }
    volumes: [miniodata:/data]
    ports: ["127.0.0.1:9001:9001"]
  mailpit:  # captures all outgoing mail locally; UI on 127.0.0.1:8025
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://orange:${POSTGRES_PASSWORD}@db:5432/orange_platform
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      MAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:3000:3000"]
    healthcheck: { test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/data/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""], interval: 30s }
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://orange:${POSTGRES_PASSWORD}@db:5432/orange_platform
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      MAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    command: ["pnpm", "worker"]
    depends_on: { db: { condition: service_healthy } }
volumes: { pgdata: {}, miniodata: {} }
