# ClerkOS internal HTTPS front end — serves https://clerkos.local on the
# municipal network. HTTP exists only to redirect to HTTPS.

server {
    listen 80;
    server_name clerkos.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name clerkos.local;

    # Internal CA or self-signed certificate (deploy/scripts/generate-certs.sh)
    ssl_certificate     /etc/nginx/certs/clerkos.crt;
    ssl_certificate_key /etc/nginx/certs/clerkos.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    client_max_body_size 110M;

    # API and Django admin
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location /django-admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
    }

    # React SPA
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        expires 1h;
    }
}
